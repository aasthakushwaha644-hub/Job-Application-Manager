<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>

    <style>
        body {
            margin: 0;
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 300px;
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-top: 0;
        }

        .input-box {
            display: flex;
            gap: 6px;
        }

        input {
            width: 200px;
            height: 25px;
            padding-left: 8px;
            border: 1px solid #999;
        }

        button {
            border: none;
            color: white;
            cursor: pointer;
        }

        .add-btn {
            background-color: #4169e1;
            padding: 8px 12px;
        }

        ul {
            padding: 0;
            margin-top: 15px;
        }

        li {
            list-style: none;
            background-color: #f5f5f5;
            padding: 8px;
            margin-bottom: 5px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background-color: #e91e3a;
            padding: 6px 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Todo List</h1>

        <div class="input-box">
            <input type="text" id="todoInput" placeholder="Enter Todo">

            <button class="add-btn" onclick="addTodo()">
                Add Todo
            </button>
        </div>

        <ul id="todoList"></ul>

    </div>


    <script>

        function addTodo() {

            
            let input = document.getElementById("todoInput");

            let todo = input.value;

            
            if (todo == "") {
                alert("Please enter a todo");
                return;
            }

            
            let li = document.createElement("li");

            
            let text = document.createElement("span");
            text.innerText = todo;

            
            let deleteButton = document.createElement("button");

            deleteButton.innerText = "Delete";
            deleteButton.className = "delete-btn";

            
            deleteButton.onclick = function() {
                li.remove();
            };

            
            
            li.appendChild(text);
            li.appendChild(deleteButton);

            
            document.getElementById("todoList").appendChild(li);

           
            input.value = "";
        }

    </script>

</body>
</html>
