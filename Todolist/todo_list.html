<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <link rel="stylesheet" href="todo_list.css">
</head>

<body>

    <div class="container">

        <h1>Todo List</h1>

        <div class="input-box">

            <input
                type="text"
                id="todoInput"
                placeholder="Enter Todo"
            >

            <button class="add-btn" onclick="addTodo()">
                Add Todo
            </button>

        </div>

        <ul id="todoList"></ul>

    </div>

    <script src="todo_list.js"></script>

</body>

</html>
